<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rota Fácil - Otimizador de Entregas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10">

  <header class="bg-slate-800 border-b border-slate-700/60 p-4 sticky top-0 z-40 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold text-blue-400 flex items-center gap-2">
        🚚 Rota Fácil
      </h1>
      <span class="text-xs bg-blue-900/60 text-blue-300 border border-blue-700/50 px-2.5 py-1 rounded-full font-medium">
        PWA Ready
      </span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- PONTO DE PARTIDA -->
    <section class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700/60">
      <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
        📍 Ponto de Partida / Início da Rota
      </label>
      <div class="relative">
        <div class="flex gap-2">
          <input 
            type="text" 
            id="originInput" 
            placeholder="Digite o endereço inicial (Rua, nº, Bairro)" 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
            autocomplete="off"
          />
          <button 
            id="btnSetOrigin" 
            class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors flex-shrink-0"
          >
            Salvar
          </button>
        </div>
        <ul id="originSuggestions" class="hidden absolute z-50 left-0 right-0 mt-1 bg-slate-900 border border-slate-700 rounded-lg shadow-xl max-h-48 overflow-y-auto text-sm text-slate-200"></ul>
      </div>
      <p id="currentOriginText" class="text-xs text-slate-400 mt-2 italic">Partida atual: Não definida</p>
    </section>

    <!-- ADICIONAR NOVA ENTREGA -->
    <section class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700/60">
      <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
        📦 Adicionar Endereço de Entrega
      </label>
      <div class="relative mb-3">
        <div class="flex gap-2">
          <input 
            type="text" 
            id="stopInput" 
            placeholder="Rua, Número, Bairro, CEP" 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
            autocomplete="off"
          />
          <button 
            id="btnAddStop" 
            class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors flex-shrink-0"
          >
            Adicionar
          </button>
        </div>
        <ul id="stopSuggestions" class="hidden absolute z-50 left-0 right-0 mt-1 bg-slate-900 border border-slate-700 rounded-lg shadow-xl max-h-48 overflow-y-auto text-sm text-slate-200"></ul>
      </div>
    </section>

    <!-- PAINEL BOLA DA VEZ -->
    <section id="nextStopPanel" class="hidden bg-gradient-to-r from-blue-900/40 to-indigo-900/40 border border-blue-500/30 p-4 rounded-xl shadow-lg">
      <div class="flex justify-between items-start mb-2">
        <span class="text-xs font-bold text-blue-400 uppercase tracking-wide">🔥 Bola da Vez (Próxima Parada)</span>
        <span id="nextStopIndex" class="text-xs bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded font-mono">#1</span>
      </div>
      <p id="nextStopAddress" class="text-base font-semibold text-white mb-3">---</p>
      <div class="flex gap-2">
        <button id="btnOpenGmaps" class="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold py-2 px-3 rounded-lg flex items-center justify-center gap-1">
          🗺️ Google Maps
        </button>
        <button id="btnOpenWaze" class="flex-1 bg-cyan-700 hover:bg-cyan-600 text-white text-xs font-bold py-2 px-3 rounded-lg flex items-center justify-center gap-1">
          💧 Waze
        </button>
        <button id="btnCompleteStop" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 px-3 rounded-lg">
          ✅ Concluir
        </button>
      </div>
    </section>

    <!-- MAPA E CONTROLES -->
    <section class="bg-slate-800 rounded-xl shadow-lg border border-slate-700/60 overflow-hidden">
      <div id="map" class="w-full h-64 bg-slate-950"></div>
      <div class="p-3 bg-slate-800 border-t border-slate-700/60 flex justify-between gap-2">
        <button id="btnOptimize" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2.5 rounded-lg transition-colors">
          ⚡ Otimizar Rota
        </button>
        <button id="btnClearAll" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-semibold py-2.5 px-3 rounded-lg transition-colors">
          🗑️ Limpar
        </button>
      </div>
    </section>

    <!-- LISTA DE ENTREGAS -->
    <section class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700/60">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">
        📋 Lista de Entregas (<span id="stopCount">0</span>)
      </h2>
      <ul id="stopsList" class="space-y-2 text-sm"></ul>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
