<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaFácil - Spoke Clone</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <!-- Ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-route text-emerald-400"></i> RotaFácil
            </h1>
            <span id="contador-paradas" class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">0 paradas</span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24 space-y-4">
        
        <!-- MAPA NA PÁGINA PRINCIPAL -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-lg relative">
            <div id="map" class="w-full h-64 z-10"></div>
            
            <!-- Indicador de Status no Mapa -->
            <div id="status-mapa" class="hidden absolute top-3 right-3 bg-slate-900/90 border border-slate-700 text-emerald-400 text-xs px-3 py-1.5 rounded-full z-20 font-semibold backdrop-blur-sm flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>Rota Ativa</span>
            </div>
        </div>

        <!-- PAINEL DA BOLA DA VEZ -->
        <div id="painel-bola-da-vez" class="hidden bg-gradient-to-r from-emerald-950/80 to-slate-800 border-2 border-emerald-500/50 rounded-2xl p-4 shadow-xl space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest flex items-center gap-1.5">
                    <i class="fa-solid fa-bullseye"></i> Próxima Entrega
                </span>
                <span id="distancia-tempo-estimado" class="text-xs text-slate-400 font-mono">Em andamento</span>
            </div>
            
            <div class="flex items-center gap-3">
                <span id="numero-bola-da-vez" class="w-9 h-9 rounded-full bg-emerald-500 text-slate-950 font-extrabold flex items-center justify-center text-base shrink-0 shadow-lg shadow-emerald-500/30">
                    1
                </span>
                <h3 id="endereco-bola-da-vez" class="text-sm font-bold text-slate-100 line-clamp-2">---</h3>
            </div>

            <div class="flex gap-2 pt-1">
                <a id="btn-navegar-ativa" href="#" target="_blank" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs text-center transition flex items-center justify-center gap-2 shadow-md">
                    <i class="fa-solid fa-location-arrow"></i> Navegar Agora (GPS)
                </a>
                <button id="btn-concluir-ativa" class="bg-slate-700 hover:bg-slate-600 text-emerald-400 px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 border border-slate-600">
                    <i class="fa-solid fa-check"></i> Entregue
                </button>
            </div>
        </div>

        <!-- CONFIGURAÇÃO DO PONTO DE PARTIDA -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-2">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-location-crosshairs text-emerald-400"></i> Ponto de Partida (Origem)
                </h2>
                <span id="label-status-origem" class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-medium">Padrão: SJC</span>
            </div>
            
            <div class="flex gap-2">
                <input type="text" id="input-origem" autocomplete="off" placeholder="Ex: Minha Casa / Depósito" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                
                <button type="button" id="btn-gps-atual" title="Usar minha localização atual (GPS)" class="bg-slate-700 hover:bg-slate-600 text-emerald-400 px-3 py-2 rounded-xl transition text-xs font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-crosshairs text-sm"></i> GPS
                </button>
            </div>
        </div>

        <!-- Formulário para Adicionar Parada -->
        <form id="form-parada" class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-3 relative z-30">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Adicionar Endereço de Entrega</h2>
            
            <div class="space-y-2">
                <div class="flex gap-2 relative">
                    <div class="relative flex-1">
                        <input type="text" id="input-endereco" autocomplete="off" required placeholder="Ex: Rua Votuporanga, 264..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                        <div id="sugestoes-container" class="hidden absolute left-0 right-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl max-h-48 overflow-y-auto z-50 divide-y divide-slate-700/50"></div>
                    </div>
                    
                    <button type="button" id="btn-camera" title="Escanear com a Câmera" class="bg-slate-700 hover:bg-slate-600 text-emerald-400 px-3.5 py-2 rounded-xl transition flex items-center justify-center text-xs font-semibold shrink-0">
                        <i class="fa-solid fa-camera text-base"></i>
                    </button>
                    <input type="file" id="input-file-camera" accept="image/*" capture="environment" class="hidden">
                </div>

                <button type="submit" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-100 font-semibold py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-2 border border-slate-600">
                    <i class="fa-solid fa-plus text-emerald-400"></i> Adicionar à Lista
                </button>
            </div>
        </form>

        <!-- AÇÕES DE ROTA -->
        <div class="flex flex-col gap-2">
            <button id="btn-comecar-rota" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold py-3 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-play text-base"></i> Começar Rota
            </button>

            <div class="flex gap-2">
                <button id="btn-otimizar" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-md">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Otimizar Rota
                </button>
                <button id="btn-limpar" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 border border-rose-500/30 px-4 py-2.5 rounded-xl text-sm transition" title="Limpar concluídas">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </div>

        <!-- Lista de Paradas -->
        <div class="space-y-3 pt-2">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Sequência das Entregas</h2>
            <div id="lista-entregas" class="space-y-3"></div>
        </div>

        <!-- BOTÃO DE RESETAR ROTA -->
        <div class="pt-6 border-t border-slate-800">
            <button id="btn-resetar-rota" class="w-full bg-rose-600/10 hover:bg-rose-600/20 text-rose-400 border border-rose-500/30 font-bold py-3 rounded-xl text-xs transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> Iniciar Outra Rota (Apagar Tudo)
            </button>
        </div>

    </main>

    <!-- Leaflet JS (Mapa) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
